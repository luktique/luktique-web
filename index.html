<meta name="description" content="Luktique, tu vestuarista personal. Tu armario digital con atuendos pensados para ti. Muy pronto.">

<style>
:root{
  --fondo:#1F1424;
  --texto:#FBF6F3;
  --suave:#CDBFD6;
  --rosa:#FF4F8E;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --cuerpo:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 70% 20%,#3B2347 0%,var(--fondo) 55%);
  color:var(--texto);
  font-family:var(--cuerpo);
  display:grid;
  place-items:center;
  padding:24px;
  text-align:center;
}
main{max-width:620px;display:flex;flex-direction:column;align-items:center;gap:22px}
.sello{
  width:72px;height:72px;border-radius:50%;
  background:var(--rosa);
  display:grid;place-items:center;
}
.sello svg{width:34px;height:34px}
h1{
  margin:0;
  font-family:var(--display);
  font-style:italic;
  font-weight:500;
  font-size:clamp(56px,14vw,104px);
  line-height:1;
  letter-spacing:-0.01em;
}
p{margin:0}
.lema{font-size:clamp(18px,3.4vw,22px);color:var(--suave);line-height:1.45;max-width:46ch}
.pronto{
  margin-top:6px;
  height:44px;padding:0 22px;
  border-radius:22px;
  border:1.5px solid var(--rosa);
  color:var(--rosa);
  font-weight:700;
  font-size:14px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  display:inline-flex;align-items:center;
}
</style>
